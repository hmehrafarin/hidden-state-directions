name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# macOS runners on purpose. pyproject.toml pins torch to the CUDA wheel indexes on Linux
# (cu121 on x86_64, cu124 on aarch64), which are several GB of wheels that CI cannot use.
# On macOS neither marker matches and uv installs the CPU build from PyPI, which is all
# the checks and tests need.
jobs:
  lint:
    name: Lint & type-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install project with all extras so mypy and deptry see every optional dependency
        run: uv sync --all-extras
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit hooks (ruff, ruff-format, codespell, mypy, deptry)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (CPU)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install project
        run: uv sync
      - name: Run tests
        run: uv run pytest -q
