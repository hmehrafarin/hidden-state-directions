[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hidden-state-directions"
version = "1.0.0"
description = "Code for the paper 'Chain-of-Thought Hidden States Reveal Task-Solving Directions for Direct Answers'"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Houman Mehrafarin" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "interpretability",
  "activation-patching",
  "linear-probing",
  "hidden-states",
  "chain-of-thought",
  "large-language-models",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "accelerate",
  "datasets",
  "h5py>=3.16.0",
  "huggingface_hub",
  "hydra-core>=1.3.2",
  "numpy",
  "omegaconf>=2.3.0",
  "polars>=1.39.3",
  "pydantic>=2.12.5",
  "scikit-learn",
  "scipy>=1.15",
  "torch==2.5.1",
  "tqdm",
  "transformers==5.8.1",
  "wandb",
]

[project.optional-dependencies]
# Hydra launcher for submitting multirun jobs to Slurm: hydra/launcher=submitit_slurm.
slurm = ["hydra-submitit-launcher>=1.2.0"]

[project.urls]
Repository = "https://github.com/hmehrafarin/hidden-state-directions"
Issues = "https://github.com/hmehrafarin/hidden-state-directions/issues"

[project.scripts]
ri = "ri.main:main"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ri", "ri.*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml"]

[dependency-groups]
# The linters are pinned so that formatting and type errors do not change with a release.
dev = [
  "codespell==2.4.3",
  "deptry==0.25.1",
  "mypy==2.4.1",
  "pre-commit>=3.7",
  "pytest>=8",
  "ruff==0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["outputs", "multirun", "wandb", "results", "hs_cache"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "UP",        # pyupgrade
  "B",         # flake8-bugbear
  "SIM",       # flake8-simplify
  "RUF",       # ruff-specific
  "PL",        # pylint
  "PERF",      # perflint
]
ignore = [
  "E501",      # line length (formatter handles it)
  "PLC0415",   # torch, transformers and wandb are imported lazily so light modules stay light
  "PLR0913",   # too many arguments
  "PLR0917",   # too many positional arguments
  "PLR2004",   # magic values
  "PERF203",   # try/except in loop
]
# Report tables use real mathematical typography (c⁺ − c⁻, 25×25, 0.71–0.90, λ).
allowed-confusables = ["−", "–", "×", "α", "λ"]

[tool.ruff.lint.isort]
known-first-party = ["ri"]

[tool.ruff.lint.pylint]
max-branches = 35
max-returns = 15
max-statements = 150

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["outputs/", "multirun/", "wandb/", "results/", "hs_cache/"]

[tool.codespell]
skip = "*.lock,*.json,./.git,./.venv,./*.egg-info,./.mypy_cache,./.ruff_cache,./.pytest_cache,./build,./dist,./outputs,./multirun,./wandb,./results,./hs_cache,./paper_tables"
ignore-words-list = "nd,te,ans,ded"

[tool.deptry]
known_first_party = ["ri"]

[tool.deptry.per_rule_ignores]
DEP002 = [
  # Used by transformers at runtime for device_map="auto"; never imported directly.
  "accelerate",
  # Hydra launcher plugin, selected with hydra/launcher=submitit_slurm.
  "hydra-submitit-launcher",
]
